<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovely Land Line</title>
    <link rel="stylesheet" href="stylesheet.css">
    <script src="LLLcode.js"></script>
    <script src="assets.js"></script>
    <script src="game.js"></script>
    <script src="utils.js"></script>
    <script src="exceptions.js"></script>
  </head>

  <body id="body" tabindex="-1" onload="readyGame()">
    <div class="main">
      <div class="header">
        <div class="header-box" id="logo">logo</div>
        <div class="header-box dial">
          <canvas class="dial-box" id="dial1"></canvas>
          <canvas class="dial-box" id="dial2"></canvas>
          <canvas class="dial-box" id="dial3"></canvas>
          <canvas class="dial-box" id="dial4"></canvas>
        </div>

        <div class="header-box" id="state-indicator">state indicator</div>
      </div>

      <iframe id="display" src=""></iframe>

      <div id="DIAL">
        DIAL MODE
      </div>

      <div id="CALL">
        CALL MODE
        LOADING
      </div>

      <div id="MESSAGE">
        MESSAGE MODE
        PRESS Q TO RECORD
        PRESS W TO STOP
        <div id="exceptions"></div>
        <div id="recordings-list"></div>
      </div>

      <div id="CONTENT">
        CONTENT MODE
      </div>
    </div>
  </body>
</html>
